name: iOS Build Check

on:
  push:
    branches: [main]
    paths:
      - "native-ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "native-ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: native-ios
        run: xcodegen generate
      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: MondayMoneyMove-xcodeproj
          path: native-ios/MondayMoneyMove.xcodeproj
      - name: Build for iPhone Simulator
        working-directory: native-ios
        run: >-
          xcodebuild
          -project MondayMoneyMove.xcodeproj
          -scheme MondayMoneyMove
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
